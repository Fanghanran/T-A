# 前端容器 nginx 配置：
#  - 静态资源 + SPA 路由回退（React Router history 模式刷新不 404）
#  - /api 反向代理到后端容器（backend:3000），关闭缓冲以支持 AI SDK 流式响应
#  - 后端上传上限 10MB / chat body 8MB，这里放宽到 20MB 覆盖所有端点

server {
    listen 80;
    server_name _;

    # 上传与请求体上限（覆盖后端 multer 10MB / JSON 8MB）
    client_max_body_size 20m;

    # gzip 压缩文本类响应
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # API 反向代理
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        # SSE / data-stream 长连接：清空 Connection 头 + 关闭缓冲，保证 token 逐段推送
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        # 长问答生成可能持续数分钟
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源带长缓存（Vite 产物带内容哈希）
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control 'public, immutable';
    }

    # SPA 入口：任意路径回退 index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
