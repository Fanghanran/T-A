name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: 安装依赖（root + server）
        run: |
          npm ci
          npm --prefix server ci

      - name: 全量门禁（build + 前端测试 + lint + format + 后端测试 + 分层检查）
        run: npm run check:all
